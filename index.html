<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>乡衡 · RISA 产业决策</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            width: 100%;
            background: #f2f4f0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        }

        /* ===== 加载占位 ===== */
        #loading {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f2f4f0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        #loading.hide {
            opacity: 0;
        }
        #loading .logo {
            font-size: 28px;
            font-weight: 700;
            color: #2e7d32;
            letter-spacing: -0.5px;
        }
        #loading .sub {
            font-size: 14px;
            color: #4a7a4a;
            margin-top: 4px;
            font-weight: 500;
        }
        #loading .spinner {
            margin-top: 24px;
            width: 32px;
            height: 32px;
            border: 3px solid rgba(46, 125, 50, 0.12);
            border-top-color: #2e7d32;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== 聊天容器：强制全屏居中 ===== */
        #app {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
        }

        /* ===== 暴力覆盖 SDK 默认样式，消除一切偏移 ===== */
        #app > *,
        .coze-chat-container,
        .coze-chat,
        [class*="coze"] {
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            border-radius: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            transform: none !important;
        }

        /* 针对可能存在的 iframe 或 div 内部偏移 */
        .coze-chat iframe,
        .coze-chat div {
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            border-radius: 0 !important;
            margin: 0 !important;
        }
    </style>
</head>
<body>

    <!-- ===== 加载占位 ===== -->
    <div id="loading">
        <div class="logo">🌾 乡衡</div>
        <div class="sub">乡村产业空间适配度指数 · RISA</div>
        <div class="spinner"></div>
    </div>

    <!-- ===== 全屏聊天容器 ===== -->
    <div id="app"></div>

    <!-- ===== Coze SDK ===== -->
    <script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.19/libs/cn/index.js">
    </script>

    <script>
        (function() {
            var loading = document.getElementById('loading');

            // 初始化 Coze SDK
            setTimeout(function() {
                try {
                    new CozeWebSDK.WebChatClient({
                        config: {
                            bot_id: "7655881339992424494"
                        },
                        componentProps: {
                            title: "乡衡 · RISA 产业决策",
                            sub_title: "适配测算 · 政策溯源 · 公益免登",
                            floating: false,      // 嵌入模式，无悬浮球
                            layout: "embed"        // 嵌入布局
                        },
                        ui: {
                            containerMode: "embed",
                            width: "100%",
                            height: "100%",
                            margin: "0 auto"
                        },
                        auth: {
                            type: "token",
                            token: "pat_P4HBxl5ykhhLUSpQHhMA2gWNCX01JJbXwEa6nYAhuQJXZ9rGRFNN4uBPYGR75W07",
                            onRefreshToken: function() {
                                return "pat_P4HBxl5ykhhLUSpQHhMA2gWNCX01JJbXwEa6nYAhuQJXZ9rGRFNN4uBPYGR75W07";
                            }
                        },
                        container: "#app"
                    });

                    // 加载完成后淡出占位
                    setTimeout(function() {
                        loading.classList.add('hide');
                        setTimeout(function() {
                            loading.style.display = 'none';
                        }, 500);
                    }, 1200);

                } catch (e) {
                    console.warn('Coze SDK 初始化失败:', e);
                    loading.innerHTML = '<div style="color:#b71c1c;font-size:14px;text-align:center;padding:20px;">加载失败，请刷新页面重试</div>';
                }
            }, 600);

            // 兜底：8秒后强制隐藏占位
            setTimeout(function() {
                if (!loading.classList.contains('hide')) {
                    loading.classList.add('hide');
                    setTimeout(function() {
                        loading.style.display = 'none';
                    }, 500);
                }
            }, 8000);
        })();
    </script>

</body>
</html>
