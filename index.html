<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>乡衡·RISA 山河共富</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600&family=SF+Pro+Text:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "SF Pro Text", system-ui, -apple-system, sans-serif;
        }
        :root {
            --main-green: #2e7d32;
            --light-green: #e8f5e9;
            --gray-bg: #f5f5f7;
            --text-dark: #1d1d1f;
            --text-gray: #6e6e73;
            --white: #ffffff;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            background-color: var(--gray-bg);
            color: var(--text-dark);
            overflow-x: hidden;
            padding-bottom: 80px;
        }
        .page-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            background: var(--main-green);
            width: 0%;
            z-index: 9999;
        }
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(16px);
            padding: 14px 16px;
            z-index: 999;
        }
        .header-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--main-green);
            text-align: center;
        }
        .wrap {
            margin-top: 70px;
            padding: 0 16px;
        }
        .title-block {
            text-align: center;
            margin: 30px 0 24px;
        }
        .main-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .desc-text {
            font-size: 14px;
            color: var(--text-gray);
            line-height: 1.6;
            padding: 0 8px;
        }

        /* 核心：聊天容器水平百分百居中，左右固定对称边距，绝对居中 */
        .chat-wrap {
            width: 100%;
            max-width: calc(100% - 32px);
            margin: 0 auto;
            height: 70vh;
            border-radius: 20px;
            overflow: hidden;
            background: var(--white);
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            /* 水平居中锁定 */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #app {
            width: 100%;
            height: 100%;
            margin: 0 auto;
        }
        .loading-tip {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--main-green);
            font-size: 14px;
            text-align: center;
        }
        .stat-box {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin: 40px 0;
        }
        .stat-item {
            background: var(--white);
            padding: 20px 8px;
            border-radius: 16px;
            text-align: center;
        }
        .stat-num {
            font-size: 32px;
            font-weight: 600;
            color: var(--main-green);
            margin-bottom: 6px;
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-gray);
        }
        .section-block {
            margin: 50px 0;
        }
        .section-h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
            text-align: center;
        }
        .section-p {
            font-size: 14px;
            color: var(--text-gray);
            line-height: 1.7;
            text-align: center;
            padding: 0 10px;
        }
        .back-top {
            position: fixed;
            right: 16px;
            bottom: 20px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--main-green);
            color: white;
            border: none;
            font-size: 16px;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }
        .back-top.show {
            opacity: 1;
            visibility: visible;
        }
        footer {
            text-align: center;
            margin-top: 60px;
            font-size: 12px;
            color: var(--text-gray);
        }
        /* 横竖屏自适应强制居中 */
        @media (orientation: landscape) {
            .chat-wrap {
                height: 60vh;
                max-width: 600px;
            }
        }
    </style>
</head>
<body>
    <div class="page-progress" id="pageProgress"></div>
    <header>
        <div class="header-title">乡衡·RISA 山河共富</div>
    </header>
    <div class="wrap">
        <div class="title-block">
            <h1 class="main-title">公益乡村产业智能决策平台</h1>
            <p class="desc-text">地理实景校准 + 官方政策溯源 · 基层村干部免费专用 · 免登录直接使用</p>
        </div>
        <!-- 严格居中聊天容器 -->
        <div class="chat-wrap">
            <div id="app">
                <div class="loading-tip">智能体加载中，请稍候</div>
            </div>
        </div>
        <div class="stat-box">
            <div class="stat-item">
                <div class="stat-num count" data-target="90">0</div>
                <div class="stat-label">研判效率提升%</div>
            </div>
            <div class="stat-item">
                <div class="stat-num count" data-target="75">0</div>
                <div class="stat-label">数据准确率提升%</div>
            </div>
            <div class="stat-item">
                <div class="stat-num count" data-target="3">0</div>
                <div class="stat-label">落地试点村镇</div>
            </div>
        </div>
        <div class="section-block">
            <h3 class="section-h3">项目研发背景</h3>
            <p class="section-p">实地走访河南、金寨、德阳村镇，针对村干部经验规划、专业软件门槛高、惠农政策获取难、老年群体使用不便痛点，自研RISA量化打分系统，配套高德地理核验、政策检索、语音朗读、PDF导出一体化服务。</p>
        </div>
        <div class="section-block">
            <h3 class="section-h3">核心创新优势</h3>
            <p class="section-p">地理耦合量化打分 · 政务官方政策溯源 · 老年友好语音适配 · 永久公益免费开放</p>
        </div>
    </div>
    <button class="back-top" id="backTop">↑</button>
    <footer>
        © 2026 华东师范大学山河共富团队 乡村振兴公益项目
    </footer>
    <script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.19/libs/cn/index.js"></script>
    <script>
        window.addEventListener('load', () => {
            const prog = document.getElementById('pageProgress');
            let w = 0;
            const t = setInterval(() => {
                w += 6;
                prog.style.width = w + '%';
                if(w >= 100) clearInterval(t);
            },25);
        })
        window.onload = () => {
            setTimeout(() => {
                new CozeWebSDK.WebChatClient({
                    config: {
                        bot_id: "7655881339992424494"
                    },
                    componentProps: {
                        title: "乡衡·RISA乡村产业决策助手",
                        sub_title: "惠农产业适配测算系统",
                        floating: false,
                        layout: "embed"
                    },
                    ui: {
                        containerMode: "embed",
                        width: "100%",
                        height: "100%",
                        margin: "0 auto"
                    },
                    auth: {
                        type: "token",
                        token: "pat_P4HBxl5ykhhLUSpQHhMA2gWNCX01JJbXwEa6nYAhuQJXZ9rGRFNN4uBPYGR75W07",
                        onRefreshToken: () => "pat_P4HBxl5ykhhLUSpQHhMA2gWNCX01JJbXwEa6nYAhuQJXZ9rGRFNN4uBPYGR75W07"
                    },
                    container: "#app"
                });
            }, 1000);
        }
        window.addEventListener('scroll', () => {
            const btn = document.getElementById('backTop');
            if(window.scrollY > 300) btn.classList.add('show');
            else btn.classList.remove('show');
        })
        document.getElementById('backTop').addEventListener('click', ()=>{
            window.scrollTo({top:0,behavior:'smooth'});
        })
        const countEls = document.querySelectorAll('.count');
        const countAnim = () => {
            countEls.forEach(el => {
                const target = Number(el.dataset.target);
                let cur = 0;
                const timer = setInterval(() => {
                    cur += Math.ceil(target / 25);
                    if(cur >= target){
                        el.textContent = target;
                        clearInterval(timer);
                    }else el.textContent = cur;
                },35);
            })
        }
        const io = new IntersectionObserver(entries => {
            if(entries[0].isIntersecting){
                countAnim();
                io.disconnect();
            }
        },{threshold:0.2})
        io.observe(document.querySelector('.stat-box'));
    </script>
</body>
</html>
