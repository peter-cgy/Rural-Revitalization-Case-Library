<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>乡衡 · RISA 产业决策</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=SF+Pro+Text:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            width: 100%;
            background: #f2f4f0;
            overflow: hidden;
            font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }

        /* ===== 全屏聊天容器 ===== */
        #app {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* ===== 加载占位（聊天加载前显示） ===== */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f2f4f0;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }
        .loading-screen.hide {
            opacity: 0;
        }

        .loading-screen .logo {
            font-size: 28px;
            font-weight: 700;
            color: #2e7d32;
            letter-spacing: -0.5px;
        }
        .loading-screen .sub {
            font-size: 14px;
            color: #4a7a4a;
            margin-top: 4px;
            font-weight: 500;
        }
        .loading-screen .spinner {
            margin-top: 24px;
            width: 32px;
            height: 32px;
            border: 3px solid rgba(46, 125, 50, 0.12);
            border-top-color: #2e7d32;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== Coze SDK 内部样式微调（覆盖默认） ===== */
        .coze-chat-container {
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            border-radius: 0 !important;
        }
        .coze-chat {
            border-radius: 0 !important;
        }
    </style>
</head>
<body>

    <!-- ===== 加载占位 ===== -->
    <div class="loading-screen" id="loadingScreen">
        <div class="logo">🌾 乡衡</div>
        <div class="sub">乡村产业空间适配度指数 · RISA</div>
        <div class="spinner"></div>
    </div>

    <!-- ===== 全屏聊天容器 ===== -->
    <div id="app"></div>

    <!-- ===== Coze SDK ===== -->
    <script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.19/libs/cn/index.js">
    </script>

    <script>
        (function() {
            var loading = document.getElementById('loadingScreen');

            // 初始化 Coze SDK（嵌入模式，全屏）
            setTimeout(function() {
                try {
                    new CozeWebSDK.WebChatClient({
                        config: {
                            bot_id: "7655881339992424494"
                        },
                        componentProps: {
                            title: "乡衡 · RISA 产业决策",
                            sub_title: "适配测算 · 政策溯源 · 公益免登",
                            floating: false,      // 嵌入模式，不用悬浮球
                            layout: "embed"        // 嵌入布局
                        },
                        ui: {
                            containerMode: "embed",
                            width: "100%",
                            height: "100%",
                            margin: "0 auto"
                        },
                        auth: {
                            type: "token",
                            token: "pat_P4HBxl5ykhhLUSpQHhMA2gWNCX01JJbXwEa6nYAhuQJXZ9rGRFNN4uBPYGR75W07",
                            onRefreshToken: function() {
                                return "pat_P4HBxl5ykhhLUSpQHhMA2gWNCX01JJbXwEa6nYAhuQJXZ9rGRFNN4uBPYGR75W07";
                            }
                        },
                        container: "#app"
                    });

                    // SDK 加载完成后隐藏加载占位
                    setTimeout(function() {
                        loading.classList.add('hide');
                        setTimeout(function() {
                            loading.style.display = 'none';
                        }, 600);
                    }, 1200);

                } catch (e) {
                    console.warn('Coze SDK 初始化失败:', e);
                    loading.innerHTML = '<div style="color:#b71c1c;font-size:14px;text-align:center;padding:20px;">加载失败，请刷新页面重试</div>';
                }
            }, 600);

            // 兜底：8秒后无论是否加载完成都隐藏占位
            setTimeout(function() {
                if (!loading.classList.contains('hide')) {
                    loading.classList.add('hide');
                    setTimeout(function() {
                        loading.style.display = 'none';
                    }, 600);
                }
            }, 8000);

        })();
    </script>

</body>
</html>
